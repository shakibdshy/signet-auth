name: CI

# Two Ubuntu Go legs (a full-check primary and a slim go 1.26 floor leg) gate
# every push and pull request. macOS is a platform sweep, not a gate: it runs
# weekly and on v* release tags. The publish jobs stay tag-only and unchanged.

on:
  push:
    branches: [main]
    tags: ["client-v*", "v*"]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    # Weekly full sweep on main: every leg including macOS.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }} ${{ matrix.primary && '· full checks' || '· floor build and test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Matrix legs share job-level groups: without the matrix value in the
      # name the two legs would cancel each other.
      group: go-${{ matrix.go }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: "1.26"
            primary: false
          - go: "1.27"
            primary: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # Floor leg: prove the go 1.26 directive holds. Everything that does not
      # depend on the Go version runs once, on the primary leg.
      - name: Build
        if: ${{ !matrix.primary }}
        run: go build ./...

      - name: Test
        if: ${{ !matrix.primary }}
        run: go test ./...

      # --- primary leg only from here on ---

      - name: Check go.mod and go.sum are tidy
        if: matrix.primary
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        if: matrix.primary
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        if: matrix.primary
        run: go vet ./...

      - name: Lint
        if: matrix.primary
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --timeout=5m

      - name: Test with the race detector and coverage
        if: matrix.primary
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build examples
        if: matrix.primary
        run: make examples

      - name: Fuzz
        if: matrix.primary
        run: make fuzz

      - name: Vulnerability scan
        if: matrix.primary
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  darwin:
    # macOS is free on this public repo but slow: sweep it weekly and when a
    # release tag is cut instead of on every push.
    name: Go 1.27 on macos-latest · platform sweep
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 15
    concurrency:
      group: darwin-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  js:
    name: Generated artifacts, TypeScript and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: js-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/ts/package-lock.json
            client/react/package-lock.json
            docs-site/package-lock.json

      - name: Check both npm packages share one version
        run: |
          client="$(node -p "require('./client/ts/package.json').version")"
          react="$(node -p "require('./client/react/package.json').version")"
          dep="$(node -p "require('./client/react/package.json').dependencies['@shakibdshy/signet-auth-client']")"
          if [ "$client" != "$react" ] || [ "$client" != "$dep" ]; then
            echo "client/ts ($client), client/react ($react) and its dependency pin ($dep) are released together at one version"
            exit 1
          fi

      - name: Install client dependencies
        run: npm ci
        working-directory: client/ts

      - name: Install React package dependencies
        run: npm ci
        working-directory: client/react

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs-site

      - name: Check generated artifacts are current
        run: make generate-check

      - name: Typecheck the TypeScript client
        run: npm run typecheck
        working-directory: client/ts

      - name: Build the TypeScript client
        # The React package resolves the client's types through dist/, which
        # only exists after a build. Without this the typecheck fails on a
        # fresh checkout even though it passes locally.
        run: npm run build
        working-directory: client/ts

      - name: Typecheck the React package
        run: npm run typecheck
        working-directory: client/react

      - name: Check documentation coverage
        run: npm run docs:check
        working-directory: docs-site

      - name: Typecheck docs
        run: npm run types:check
        working-directory: docs-site

      - name: Build docs
        run: npm run build
        working-directory: docs-site

  publish-client:
    name: Publish TypeScript client
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: [go, js]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: client/ts/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client/ts

      - name: Verify the client compiles
        run: npm run typecheck
        working-directory: client/ts

      - name: Check the tag version matches package.json
        working-directory: client/ts
        run: |
          tag="${GITHUB_REF_NAME#client-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag client-v$tag does not match package version $version"
            exit 1
          fi

      - name: Publish client
        run: npm publish --access public
        working-directory: client/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-react:
    name: Publish React hooks
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: publish-client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: client/react/package-lock.json

      - name: Install React package dependencies
        run: npm ci
        working-directory: client/react

      - name: Verify the React package compiles
        run: npm run typecheck
        working-directory: client/react

      - name: Check the tag version matches package.json
        working-directory: client/react
        run: |
          tag="${GITHUB_REF_NAME#client-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag client-v$tag does not match package version $version"
            exit 1
          fi

      - name: Publish React hooks
        run: npm publish --access public
        working-directory: client/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
